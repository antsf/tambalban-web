name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build CSS
        run: npm run build:css

      - name: Verify CSS tracked
        run: git diff --exit-code -- public/tailwind.css || (echo "public/tailwind.css is out of sync — run npm run build:css and commit it" && exit 1)