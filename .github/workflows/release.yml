  #   needs: release
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: worker
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
