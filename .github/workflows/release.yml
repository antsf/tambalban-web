name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build CSS and UI assets
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: CI and release regression tests
        run: npm run test:ci

      - name: Verify tag matches package.json version
        run: |
          MANIFEST_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match worker/package.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Validate exact CHANGELOG section
        run: node ../scripts/release-notes.mjs

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section for this tag
        run: node scripts/release-notes.mjs --output release_notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: tambalban-web ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This repo is a Cloudflare Worker, not a package/binary artifact — the actual
  # production deploy already happens on every push to `main` via ci.yml's `deploy`
  # job (npx wrangler deploy). Re-deploying here on tag push would duplicate that
  # path and risk deploying an out-of-sync commit if the tag doesn't point at main's
  # HEAD. Left commented out until there's an explicit reason to deploy specifically
  # from tags instead of from `main` pushes, plus user go-ahead.
